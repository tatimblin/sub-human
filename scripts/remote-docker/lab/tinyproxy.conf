# corp-proxy: the corporate HTTP egress of the sub-human lab. joiner-b's network (corp) is internal: this proxy is
# its only way out. CONNECT only, to the ports below; no UDP at all. Every request is logged (scenario evidence).
User nobody
Group nogroup
Port 3128
Listen 0.0.0.0
Timeout 600
LogLevel Connect
MaxClients 50
Allow 0.0.0.0/0
# CONNECT to https (tls-front) and to toxiproxy's ssh ports (devbox, devbox-old); nothing else
ConnectPort 443
ConnectPort 22001
ConnectPort 22003
DisableViaHeader Yes
