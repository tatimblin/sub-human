# The sub-human lab (scripts/remote-docker/README.md has the diagram): a multi-machine topology for the remote rooms
# 1.0/1.1 scenarios (scripts/remote-docker/scenarios/, `harness.ts scenarios`). Project name sub-human-lab, so it
# never touches the older single-devbox stack (compose.yml, sub-human-remote).
#
# Networks
#   core  internal: the devboxes, toxiproxy's upstream leg, tls-front's upstream leg
#   edge  the "internet": joiner-a, joiner-b, toxiproxy, tls-front. The only network that publishes ports to this Mac
#         (toxiproxy's api and its devbox ssh port, on 127.0.0.1, for the manual mode)
# The devbox is on core only: a joiner reaches it through toxiproxy (the chaos-able WAN path: one proxy per joiner,
# so a cut on one leaves the other's up) or tls-front (1.1, the stand-in for Tailscale Serve: the devbox's seats name
# it through SUB_HUMAN_WEB_FRONT, honoured under SUB_HUMAN_LAB=1 only).
name: sub-human-lab

x-machine: &machine
  build: .
  image: sub-human-lab:node24
  init: true
  volumes:
    - ../../../plugin/sub-human:/plugin:ro
    - .:/lab:ro

services:
  devbox:
    <<: *machine
    command: [devbox]
    hostname: devbox
    environment:
      LAB_WS_PORT: ${LAB_WS_PORT:-7420}
      LAB_WS_FWD_PORT: ${LAB_WS_FWD_PORT:-7421}
      SUB_HUMAN_LAB: '1'
      SUB_HUMAN_WEB_FRONT: https://tls-front
    networks: [core]

  devbox-old:
    # plugin 0.5.0-beta.15 (git ref 7c97bdb, LAB_OLD_REF), baked into the image by harness.ts (lab.ts buildOld); no mount
    image: sub-human-lab-old:${LAB_OLD_REF:-7c97bdb}
    init: true
    command: [devbox]
    hostname: devbox-old
    volumes:
      - .:/lab:ro
    networks: [core]

  joiner-a:
    <<: *machine
    command: [joiner]
    hostname: joiner-a
    cap_add: [NET_ADMIN]
    networks: [edge]

  joiner-b:
    <<: *machine
    command: [joiner]
    hostname: joiner-b
    cap_add: [NET_ADMIN]
    networks: [edge]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    hostname: toxiproxy
    networks: [edge, core]
    ports:
      - "127.0.0.1::8474"
      - "127.0.0.1::22001"

  tls-front:
    image: caddy:2.10-alpine
    hostname: tls-front
    environment:
      LAB_WS_FWD_PORT: ${LAB_WS_FWD_PORT:-7421}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [edge, core]

networks:
  core:
    internal: true
  edge: {}
