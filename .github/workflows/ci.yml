name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # nightly: the canary job only (the other jobs skip a scheduled run)
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  # a push never cancels the nightly canary, nor the canary a push
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'canary' || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 22.18.0: the floor (engines, hooks/node.sh, doctor): the first node that strips types with no flag or warning
        # and has import.meta.main
        node: ['22.18.0', '22', '24', '26']
        include:
          - os: macos-latest
            node: '24'
    steps:
      - uses: actions/checkout@v4
        with:
          # check-version compares against the last version bump (or the newest tag): it needs the history
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: git identity (the tests make throwaway repos)
        run: |
          git config --global user.name "sub-human CI"
          git config --global user.email "ci@sub-human.invalid"
      - name: 'npm ci (typescript, @types/node and oxlint: the typecheck and the linter only)'
        run: npm ci
      - name: npm test (the typecheck first; the mods tests skip without Claude Code)
        run: npm test
      # oxlint's type-aware rules and the type-escape ratchet; the same on every node, so once.
      # (npm run validate runs in the validate job, which installs the claude CLI; test:mods still skips here)
      - name: lint
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm run lint
      - name: version bumped with the plugin change
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-version.ts "origin/$BASE_REF"

  # claude plugin validate --strict on every push and PR, with the Claude Code version the plugin was probed on
  # (lib/cc/contract.json "probed"), installed as the canary does: npm i --prefix a temp dir (never global), the
  # platform package's native binary, a fresh CLAUDE_CONFIG_DIR. The directory's other rules: npm run lint
  # (scripts/directory-lint.ts).
  validate:
    name: plugin validate --strict (claude-code@probed)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: install Claude Code (the probed version)
        id: cc
        run: |
          version=$(node -p "require('./plugin/sub-human/lib/cc/contract.json').probed")
          prefix="$RUNNER_TEMP/claude-code"
          npm i --prefix "$prefix" --no-audit --no-fund --no-save "@anthropic-ai/claude-code@$version"
          bin="$prefix/node_modules/@anthropic-ai/claude-code-linux-x64/claude"
          [ -x "$bin" ] || bin="$prefix/node_modules/@anthropic-ai/claude-code/bin/claude.exe"
          "$bin" --version
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: claude plugin validate plugin/sub-human --strict
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-config
        run: |
          mkdir -p "$CLAUDE_CONFIG_DIR"
          "${{ steps.cc.outputs.bin }}" plugin validate plugin/sub-human --strict

  remote-docker:
    name: remote rooms over real SSH (docker)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # the skew scenario builds devbox-old from an older commit (git archive): it needs the history
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: npm run test:remote-docker
        run: npm run test:remote-docker

  # An early warning: install Claude Code's latest and next from npm and run the probe (without the typings check),
  # the hooks module's wiring tests (a modules-off skip fails) and plugin validate --strict against each.
  canary:
    name: canary (claude-code@${{ matrix.tag }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tag: [latest, next]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: git identity (the wiring tests make throwaway repos)
        run: |
          git config --global user.name "sub-human CI"
          git config --global user.email "ci@sub-human.invalid"
      - run: npm ci
      - name: npm run canary
        run: npm run canary -- ${{ matrix.tag }}
      - name: keep the summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-${{ matrix.tag }}
          path: scripts/canary/last.json
          if-no-files-found: ignore
