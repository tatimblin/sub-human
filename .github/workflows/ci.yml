name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # nightly: the canary job only (the other jobs skip a scheduled run)
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  # a push never cancels the nightly canary, nor the canary a push
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'canary' || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 22.18.0: the floor (engines, hooks/node.sh, doctor): the first node that strips types with no flag or warning
        # and has import.meta.main
        node: ['22.18.0', '22', '24', '26']
        include:
          - os: macos-latest
            node: '24'
    steps:
      - uses: actions/checkout@v4
        with:
          # check-version compares against the last version bump (or the newest tag): it needs the history
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: git identity (the tests make throwaway repos)
        run: |
          git config --global user.name "sub-human CI"
          git config --global user.email "ci@sub-human.invalid"
      - name: 'npm ci (typescript, @types/node, oxlint and the vendored packages: checks only)'
        run: npm ci
      # npm test without test:module and validate (they need Claude Code, so they run in the claude job): one script,
      # so the list never drifts from npm test's
      - name: 'npm run test:offline (typecheck, vendored files, node and script tests)'
        run: npm run --silent test:offline
      - name: size budget
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: node scripts/budget.ts
      # oxlint's type-aware rules, the type-escape ratchet and directory-lint; the same on every node, so once
      - name: lint
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm run lint
      - name: version bumped with the plugin change
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-version.ts "origin/$BASE_REF"

  # Everything that needs Claude Code, on the version core/cc/contract.json `probed` names, installed as the canary
  # does (scripts/lib/claude-bin.ts: npm i --prefix a temp dir, never global; the platform package's native binary):
  # the probe with its typings check, the kit tests (hooks modules off is a failure, never a skip) and
  # plugin validate --strict (scripts/validate.ts, a fresh config dir).
  claude:
    name: claude-code@probed (probe, kit tests, validate)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: git identity (the kit tests may make throwaway repos)
        run: |
          git config --global user.name "sub-human CI"
          git config --global user.email "ci@sub-human.invalid"
      - run: npm ci
      - name: install Claude Code (contract.json probed)
        id: cc
        run: |
          bin="$(npm run --silent probe -- --print-bin)"
          "$bin" --version
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: npm run probe
        run: npm run probe -- --bin "${{ steps.cc.outputs.bin }}"
      - name: npm run test:module
        env:
          SUB_HUMAN_CLAUDE_BIN: ${{ steps.cc.outputs.bin }}
        run: npm run test:module
      - name: npm run validate (claude plugin validate --strict)
        env:
          SUB_HUMAN_CLAUDE_BIN: ${{ steps.cc.outputs.bin }}
        run: npm run validate

  # The early warning (docs/TESTING.md §7): Claude Code's latest and next from npm, each with its typings diffed
  # against typings/, the probe, the kit tests (modules off fails) and plugin validate --strict. No model calls.
  canary:
    name: canary (claude-code@${{ matrix.tag }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tag: [latest, next]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: git identity (the kit tests may make throwaway repos)
        run: |
          git config --global user.name "sub-human CI"
          git config --global user.email "ci@sub-human.invalid"
      - run: npm ci
      - name: npm run canary
        run: npm run canary -- ${{ matrix.tag }}
      - name: keep the summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-${{ matrix.tag }}
          path: scripts/canary/last.json
          if-no-files-found: ignore
