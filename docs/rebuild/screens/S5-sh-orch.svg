<text x="628.2" y="446" textLength="343.2" lengthAdjust="spacing" xml:space="preserve">. The opaque cursor encodes the last item's </text>
<text x="971.4" y="446" fill="#b1b9f9" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">createdAt</text>
<text x="1041.6" y="446" textLength="39" lengthAdjust="spacing" xml:space="preserve"> and </text>
