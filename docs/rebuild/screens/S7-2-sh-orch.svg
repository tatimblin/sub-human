<text x="136.8" y="531" fill="#949494" textLength="54.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">(5s · ↓</text>
<text x="199.2" y="531" fill="#949494" textLength="85.8" lengthAdjust="spacing" xml:space="preserve">483 tokens)</text>
<text x="12" y="548" fill="#949494" textLength="561.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ⎿  Tip: You have 4 plugins you haven't used lately. Disable them with </text>
