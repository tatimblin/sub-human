<text x="628.2" y="548" fill="#949494" textLength="319.8" lengthAdjust="spacing" xml:space="preserve"> to free up context and speed up startup.</text>
<text x="511.2" y="565" fill="#ffd700" textLength="179.4" lengthAdjust="spacing" xml:space="preserve">Update available! Run: </text>
<text x="690.6" y="565" fill="#ffd700" font-weight="bold" textLength="241.8" lengthAdjust="spacing" xml:space="preserve">brew upgrade claude-code@latest</text>
