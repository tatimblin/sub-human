<text x="355.2" y="89" textLength="226.2" lengthAdjust="spacing" xml:space="preserve">, so they propose sorting by </text>
<text x="581.4" y="89" fill="#afd7ff" textLength="179.4" lengthAdjust="spacing" xml:space="preserve">createdAt DESC, id DESC</text>
<text x="760.8" y="89" textLength="163.8" lengthAdjust="spacing" xml:space="preserve"> and encoding both in</text>
<text x="12" y="106" textLength="312" lengthAdjust="spacing" xml:space="preserve">     the cursor. Does that work for you?</text>
<text x="12" y="140" textLength="444.6" lengthAdjust="spacing" xml:space="preserve">  They're also waiting for alice's view before proposing.</text>
<text x="12" y="174" fill="#949494" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✻</text>
<text x="27.6" y="174" fill="#949494" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">Waiting for </text>
