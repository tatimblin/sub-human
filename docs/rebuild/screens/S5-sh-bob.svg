<text x="129" y="174" fill="#949494" textLength="218.4" lengthAdjust="spacing" xml:space="preserve"> background agents to finish</text>
<text x="12" y="208" fill="#4e4e4e" textLength="15.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">❯ </text>
<text x="27.6" y="208" fill="#ffffff" textLength="639.6" lengthAdjust="spacing" xml:space="preserve">@room @orch fine with that; 400 on a bad cursor. please propose it to alice and me</text>
