<text x="19.8" y="276" textLength="312" lengthAdjust="spacing" xml:space="preserve"> Monitor event: &quot;sub-human room notices&quot;</text>
<text x="12" y="310" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="310" textLength="436.8" lengthAdjust="spacing" xml:space="preserve"> Orch is asking one more thing before proposing: should </text>
