<text x="12" y="514" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="514" textLength="819" lengthAdjust="spacing" xml:space="preserve"> Your objection to orch's paging proposal is recorded in the room, with your change request: a test that </text>
