<text x="12" y="72" textLength="39" lengthAdjust="spacing" xml:space="preserve">  1. </text>
<text x="51" y="72" font-weight="bold" textLength="163.8" lengthAdjust="spacing" xml:space="preserve">Default and max limit</text>
<text x="214.8" y="72" textLength="600.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — they suggest 20/100. Should a too-large limit get clamped or return a 400?</text>
<text x="12" y="89" textLength="39" lengthAdjust="spacing" xml:space="preserve">  2. </text>
<text x="51" y="89" font-weight="bold" textLength="117" lengthAdjust="spacing" xml:space="preserve">Cursor encoding</text>
<text x="168" y="89" textLength="117" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — Tasks share </text>
