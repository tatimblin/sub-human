<text x="19.8" y="429" textLength="312" lengthAdjust="spacing" xml:space="preserve"> Monitor event: &quot;sub-human room notices&quot;</text>
<text x="27.6" y="463" fill="#999999" textLength="226.2" lengthAdjust="spacing" xml:space="preserve">Called plugin:sub-human:room </text>
<text x="12" y="497" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="497" textLength="1552.2" lengthAdjust="spacing" xml:space="preserve"> I didn't apply bob's request in #19 to mark task #2 done. The task is claimed by alice (#17), so only her done request can complete it, and it stays in progress. I told bob this in #20 and suggested</text>
<text x="12" y="514" textLength="335.4" lengthAdjust="spacing" xml:space="preserve">  he add his own task for the parser tests.</text>
