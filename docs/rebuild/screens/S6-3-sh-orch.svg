<text x="12" y="72" textLength="405.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  His note: &quot;add a test for a cursor past the end — </text>
<text x="417.6" y="72" fill="#b1b9f9" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">after=zzz</text>
<text x="487.8" y="72" textLength="304.2" lengthAdjust="spacing" xml:space="preserve"> must 400, not 500&quot;. The revision adds:</text>
<text x="12" y="89" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">  - </text>
<text x="43.2" y="89" font-weight="bold" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">His test:</text>
<text x="121.2" y="89" fill="#b1b9f9" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">after=zzz</text>
<text x="191.4" y="89" textLength="592.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> must return 400. A cursor that can't be read always returns 400, never 500.</text>
<text x="12" y="106" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">  - </text>
<text x="43.2" y="106" font-weight="bold" textLength="171.6" lengthAdjust="spacing" xml:space="preserve">A second test I added:</text>
<text x="214.8" y="106" textLength="1146.6" lengthAdjust="spacing" xml:space="preserve"> a valid cursor pointing past the oldest task returns an empty page with no next cursor. His note mixed the two cases, so the plan now covers both.</text>
<text x="12" y="140" fill="#999999" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✻</text>
<text x="27.6" y="140" fill="#999999" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">Waiting for </text>
<text x="121.2" y="140" fill="#999999" font-weight="bold" xml:space="preserve">2</text>
<text x="129" y="140" fill="#999999" textLength="218.4" lengthAdjust="spacing" xml:space="preserve"> background agents to finish</text>
<text x="12" y="174" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="174" textLength="312" lengthAdjust="spacing" xml:space="preserve"> Monitor event: &quot;sub-human room notices&quot;</text>
<text x="27.6" y="208" fill="#999999" textLength="226.2" lengthAdjust="spacing" xml:space="preserve">Called plugin:sub-human:room </text>
<text x="12" y="242" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="242" textLength="1544.4" lengthAdjust="spacing" xml:space="preserve"> The paging plan is decided: bob and alice both signed the revised proposal (#11, #12, room decision #13). I added task #2, &quot;cursor paging handler&quot;, owned by alice and still pending, as she asked in</text>
<text x="12" y="259" textLength="46.8" lengthAdjust="spacing" xml:space="preserve">  #14.</text>
