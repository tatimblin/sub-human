<text x="12" y="55" textLength="257.4" lengthAdjust="spacing" xml:space="preserve">  Nobody has answered a card yet.</text>
<text x="12" y="89" fill="#999999" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✻</text>
<text x="27.6" y="89" fill="#999999" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">Waiting for </text>
