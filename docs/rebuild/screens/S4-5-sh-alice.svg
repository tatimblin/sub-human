<text x="35.4" y="106" font-weight="bold" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">Verification</text>
<text x="932.4" y="106" fill="#949494" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">↑</text>
<text x="12" y="140" textLength="39" lengthAdjust="spacing" xml:space="preserve">   - </text>
<text x="51" y="140" fill="#afd7ff" textLength="62.4" lengthAdjust="spacing" xml:space="preserve">npm test</text>
<text x="113.4" y="140" textLength="46.8" lengthAdjust="spacing" xml:space="preserve"> with </text>
<text x="160.2" y="140" fill="#afd7ff" textLength="54.6" lengthAdjust="spacing" xml:space="preserve">reset()</text>
