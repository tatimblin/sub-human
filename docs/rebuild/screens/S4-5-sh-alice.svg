<text x="698.4" y="242" xml:space="preserve">.</text>
<text x="35.4" y="276" font-weight="bold" textLength="109.2" lengthAdjust="spacing" xml:space="preserve">Open questions</text>
<text x="12" y="310" textLength="421.2" lengthAdjust="spacing" xml:space="preserve">   1. Is a default limit of 20 and a max of 100 right?</text>
<text x="12" y="327" textLength="202.8" lengthAdjust="spacing" xml:space="preserve">   2. For an out-of-range </text>
<text x="214.8" y="327" fill="#afd7ff" textLength="39" lengthAdjust="spacing" xml:space="preserve">limit</text>
<text x="253.8" y="327" textLength="483.6" lengthAdjust="spacing" xml:space="preserve">, should the server return 400 (proposed) or clamp to the max?</text>
<text x="12" y="344" textLength="218.4" lengthAdjust="spacing" xml:space="preserve">   3. Is the response shape </text>
<text x="230.4" y="344" fill="#afd7ff" textLength="156" lengthAdjust="spacing" xml:space="preserve">{items, next_cursor}</text>
<text x="386.4" y="344" textLength="351" lengthAdjust="spacing" xml:space="preserve"> right, or do you want a different key (e.g. </text>
<text x="737.4" y="344" fill="#afd7ff" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">next</text>
<text x="768.6" y="344" textLength="62.4" lengthAdjust="spacing" xml:space="preserve">), or a </text>
<text x="831" y="344" fill="#afd7ff" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">Link</text>
<text x="862.2" y="344" textLength="62.4" lengthAdjust="spacing" xml:space="preserve"> header?</text>
<text x="12" y="361" textLength="631.8" lengthAdjust="spacing" xml:space="preserve">   4. Should the cursor be signed or encrypted, or is base64 JSON enough for now?</text>
