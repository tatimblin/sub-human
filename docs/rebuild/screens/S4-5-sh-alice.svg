<text x="409.8" y="208" textLength="46.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> → 400</text>
<text x="12" y="225" textLength="592.8" lengthAdjust="spacing" xml:space="preserve">     - inserting a task between page fetches does not change the later pages</text>
