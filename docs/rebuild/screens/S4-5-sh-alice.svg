<text x="136.8" y="208" fill="#afd7ff" textLength="15.6" lengthAdjust="spacing" xml:space="preserve">-1</text>
<text x="152.4" y="208" textLength="15.6" lengthAdjust="spacing" xml:space="preserve">, </text>
<text x="168" y="208" fill="#afd7ff" textLength="23.4" lengthAdjust="spacing" xml:space="preserve">abc</text>
<text x="191.4" y="208" textLength="15.6" lengthAdjust="spacing" xml:space="preserve">, </text>
<text x="207" y="208" fill="#afd7ff" textLength="23.4" lengthAdjust="spacing" xml:space="preserve">101</text>
<text x="230.4" y="208" textLength="140.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> → 400; a garbage </text>
