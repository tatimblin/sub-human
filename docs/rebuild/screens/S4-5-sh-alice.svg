<text x="12" y="191" textLength="709.8" lengthAdjust="spacing" xml:space="preserve">     - a page boundary that falls inside a shared timestamp neither skips nor repeats a row</text>
<text x="12" y="208" textLength="54.6" lengthAdjust="spacing" xml:space="preserve">     - </text>
<text x="66.6" y="208" fill="#afd7ff" textLength="54.6" lengthAdjust="spacing" xml:space="preserve">limit=0</text>
