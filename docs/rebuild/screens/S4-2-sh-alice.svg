<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 734" width="960" height="734" role="img" aria-label="alice · S4" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13">
<rect x="0.5" y="0.5" width="959" height="733" rx="9" fill="#16181d" stroke="#3a3e48"/>
<path d="M0.5 30V9.5a9 9 0 0 1 9-9h941a9 9 0 0 1 9 9V30z" fill="#22252c"/>
<line x1="0.5" y1="30" x2="959.5" y2="30" stroke="#3a3e48"/>
<circle cx="16" cy="15" r="5.5" fill="#ff5f57"/>
<circle cx="34" cy="15" r="5.5" fill="#febc2e"/>
<circle cx="52" cy="15" r="5.5" fill="#28c840"/>
<text x="480" y="19" text-anchor="middle" fill="#9aa1ad" font-size="12" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">alice · S4</text>
<g fill="#d6dbe5">
<text x="12" y="55" fill="#5fafaf" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="55" textLength="140.4" lengthAdjust="spacing" xml:space="preserve"> Entered plan mode</text>
<text x="27.6" y="72" fill="#949494" textLength="507" lengthAdjust="spacing" xml:space="preserve">Claude is now exploring and designing an implementation approach.</text>
<text x="12" y="89" fill="#afd7ff" textLength="936" lengthAdjust="spacingAndGlyphs" xml:space="preserve">▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔</text>
<text x="12" y="106" textLength="39" lengthAdjust="spacing" xml:space="preserve">   - </text>
<text x="51" y="106" fill="#afd7ff" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">src/store.js</text>
<text x="144.6" y="106" textLength="15.6" lengthAdjust="spacing" xml:space="preserve">: </text>
<text x="160.2" y="106" fill="#afd7ff" textLength="78" lengthAdjust="spacing" xml:space="preserve">allTasks()</text>
<text x="238.2" y="106" textLength="436.8" lengthAdjust="spacing" xml:space="preserve"> returns tasks in insertion order. Each task looks like </text>
<text x="675" y="106" fill="#afd7ff" textLength="218.4" lengthAdjust="spacing" xml:space="preserve">{id, title, done, createdAt}</text>
<text x="893.4" y="106" textLength="39" lengthAdjust="spacing" xml:space="preserve">.    </text>
<text x="932.4" y="106" fill="#949494" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">↑</text>
<text x="12" y="123" textLength="897" lengthAdjust="spacing" xml:space="preserve">   - It stands in for a Postgres table with about 4M rows and about 30 inserts/s at peak. So offset paging would be</text>
<text x="12" y="140" textLength="351" lengthAdjust="spacing" xml:space="preserve">     slow and would drift as new rows arrive.</text>
<text x="12" y="157" textLength="39" lengthAdjust="spacing" xml:space="preserve">   - </text>
<text x="51" y="157" font-weight="bold" textLength="179.4" lengthAdjust="spacing" xml:space="preserve">Tasks share timestamps.</text>
<text x="238.2" y="157" fill="#afd7ff" textLength="46.8" lengthAdjust="spacing" xml:space="preserve">seed()</text>
<text x="285" y="157" textLength="234" lengthAdjust="spacing" xml:space="preserve"> gives every 3 tasks the same </text>
<text x="519" y="157" fill="#afd7ff" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">createdAt</text>
<text x="589.2" y="157" textLength="312" lengthAdjust="spacing" xml:space="preserve"> (&quot;as bulk imports do in production&quot;). A</text>
<text x="12" y="174" textLength="202.8" lengthAdjust="spacing" xml:space="preserve">     cursor built only on </text>
<text x="214.8" y="174" fill="#afd7ff" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">createdAt</text>
<text x="285" y="174" textLength="319.8" lengthAdjust="spacing" xml:space="preserve"> would skip or repeat rows at page edges.</text>
<text x="35.4" y="208" font-weight="bold" textLength="117" lengthAdjust="spacing" xml:space="preserve">Proposed design</text>
<text x="12" y="242" textLength="39" lengthAdjust="spacing" xml:space="preserve">   - </text>
<text x="51" y="242" font-weight="bold" textLength="46.8" lengthAdjust="spacing" xml:space="preserve">Order:</text>
<text x="105.6" y="242" fill="#afd7ff" textLength="179.4" lengthAdjust="spacing" xml:space="preserve">createdAt DESC, id DESC</text>
<text x="285" y="242" textLength="15.6" lengthAdjust="spacing" xml:space="preserve">. </text>
<text x="300.6" y="242" fill="#afd7ff" textLength="15.6" lengthAdjust="spacing" xml:space="preserve">id</text>
<text x="316.2" y="242" textLength="366.6" lengthAdjust="spacing" xml:space="preserve"> breaks ties, so the order is total and stable.</text>
<text x="12" y="259" textLength="39" lengthAdjust="spacing" xml:space="preserve">   - </text>
<text x="51" y="259" font-weight="bold" textLength="62.4" lengthAdjust="spacing" xml:space="preserve">Request:</text>
<text x="121.2" y="259" fill="#afd7ff" textLength="241.8" lengthAdjust="spacing" xml:space="preserve">GET /tasks?limit=N&amp;after=CURSOR</text>
<text x="12" y="276" textLength="54.6" lengthAdjust="spacing" xml:space="preserve">     - </text>
<text x="66.6" y="276" fill="#afd7ff" textLength="39" lengthAdjust="spacing" xml:space="preserve">limit</text>
<text x="105.6" y="276" textLength="795.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">: default 20, max 100. If it is not a positive integer, or is over the max, the server returns 400 (it</text>
<text x="12" y="293" textLength="179.4" lengthAdjust="spacing" xml:space="preserve">       does not clamp).</text>
<text x="12" y="310" textLength="54.6" lengthAdjust="spacing" xml:space="preserve">     - </text>
<text x="66.6" y="310" fill="#afd7ff" textLength="39" lengthAdjust="spacing" xml:space="preserve">after</text>
<text x="105.6" y="310" textLength="436.8" lengthAdjust="spacing" xml:space="preserve">: optional. Leave it out to get the first (newest) page.</text>
<text x="12" y="327" textLength="39" lengthAdjust="spacing" xml:space="preserve">   - </text>
<text x="51" y="327" font-weight="bold" textLength="54.6" lengthAdjust="spacing" xml:space="preserve">Cursor:</text>
<text x="105.6" y="327" textLength="109.2" lengthAdjust="spacing" xml:space="preserve"> base64url of </text>
<text x="214.8" y="327" fill="#afd7ff" textLength="288.6" lengthAdjust="spacing" xml:space="preserve">JSON.stringify({c: createdAt, i: id})</text>
<text x="503.4" y="327" textLength="397.8" lengthAdjust="spacing" xml:space="preserve"> for the last item on the page. Clients treat it as</text>
<text x="12" y="344" textLength="553.8" lengthAdjust="spacing" xml:space="preserve">     opaque. If it does not decode or validate, the server returns 400 </text>
<text x="565.8" y="344" fill="#afd7ff" textLength="195" lengthAdjust="spacing" xml:space="preserve">{error: 'invalid cursor'}</text>
<text x="760.8" y="344" xml:space="preserve">.</text>
<text x="12" y="361" textLength="39" lengthAdjust="spacing" xml:space="preserve">   - </text>
<text x="51" y="361" font-weight="bold" textLength="109.2" lengthAdjust="spacing" xml:space="preserve">Keyset filter:</text>
<text x="160.2" y="361" textLength="132.6" lengthAdjust="spacing" xml:space="preserve"> keep a row when </text>
<text x="292.8" y="361" fill="#afd7ff" textLength="101.4" lengthAdjust="spacing" xml:space="preserve">createdAt &lt; c</text>
<text x="394.2" y="361" textLength="39" lengthAdjust="spacing" xml:space="preserve"> OR (</text>
<text x="433.2" y="361" fill="#afd7ff" textLength="109.2" lengthAdjust="spacing" xml:space="preserve">createdAt == c</text>
<text x="542.4" y="361" textLength="39" lengthAdjust="spacing" xml:space="preserve"> AND </text>
<text x="581.4" y="361" fill="#afd7ff" textLength="46.8" lengthAdjust="spacing" xml:space="preserve">id &lt; i</text>
<text x="628.2" y="361" textLength="218.4" lengthAdjust="spacing" xml:space="preserve">). In Postgres this becomes </text>
<text x="846.6" y="361" fill="#afd7ff" textLength="46.8" lengthAdjust="spacing" xml:space="preserve">WHERE </text>
<text x="51" y="378" fill="#afd7ff" textLength="561.6" lengthAdjust="spacing" xml:space="preserve">(created_at, id) &lt; ($1, $2) ORDER BY created_at DESC, id DESC LIMIT $3+1</text>
<text x="612.6" y="378" textLength="187.2" lengthAdjust="spacing" xml:space="preserve">, backed by an index on </text>
<text x="799.8" y="378" fill="#afd7ff" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">(created_at </text>
<text x="51" y="395" fill="#afd7ff" textLength="109.2" lengthAdjust="spacing" xml:space="preserve">DESC, id DESC)</text>
<text x="160.2" y="395" xml:space="preserve">.</text>
<text x="12" y="412" textLength="39" lengthAdjust="spacing" xml:space="preserve">   - </text>
<text x="51" y="412" font-weight="bold" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">Response:</text>
<text x="129" y="412" fill="#afd7ff" textLength="343.2" lengthAdjust="spacing" xml:space="preserve">200 {items: [...], next_cursor: string|null}</text>
<text x="472.2" y="412" textLength="62.4" lengthAdjust="spacing" xml:space="preserve">. Fetch </text>
<text x="534.6" y="412" fill="#afd7ff" textLength="54.6" lengthAdjust="spacing" xml:space="preserve">limit+1</text>
<text x="589.2" y="412" textLength="54.6" lengthAdjust="spacing" xml:space="preserve"> rows; </text>
<text x="643.8" y="412" fill="#afd7ff" textLength="85.8" lengthAdjust="spacing" xml:space="preserve">next_cursor</text>
<text x="729.6" y="412" textLength="179.4" lengthAdjust="spacing" xml:space="preserve"> is null when there are</text>
<text x="12" y="429" textLength="140.4" lengthAdjust="spacing" xml:space="preserve">     no more rows.</text>
<text x="12" y="446" textLength="39" lengthAdjust="spacing" xml:space="preserve">   - </text>
<text x="51" y="446" font-weight="bold" textLength="195" lengthAdjust="spacing" xml:space="preserve">New inserts while paging:</text>
<text x="246" y="446" textLength="663" lengthAdjust="spacing" xml:space="preserve"> they go at the head of the list, so a client walking the pages never sees duplicates</text>
<text x="12" y="463" textLength="678.6" lengthAdjust="spacing" xml:space="preserve">     or gaps. It also won't see the new rows until it starts again from the first page.</text>
<text x="35.4" y="497" font-weight="bold" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">Set aside</text>
<text x="12" y="531" textLength="39" lengthAdjust="spacing" xml:space="preserve">   - </text>
<text x="51" y="531" font-weight="bold" textLength="156" lengthAdjust="spacing" xml:space="preserve">Offset/page numbers:</text>
<text x="207" y="531" textLength="491.4" lengthAdjust="spacing" xml:space="preserve"> O(offset) on 4M rows, and pages shift whenever inserts happen.</text>
<text x="12" y="548" textLength="39" lengthAdjust="spacing" xml:space="preserve">   - </text>
<text x="51" y="548" font-weight="bold" textLength="78" lengthAdjust="spacing" xml:space="preserve">Cursor on </text>
<text x="129" y="548" fill="#afd7ff" font-weight="bold" textLength="15.6" lengthAdjust="spacing" xml:space="preserve">id</text>
<text x="144.6" y="548" font-weight="bold" textLength="54.6" lengthAdjust="spacing" xml:space="preserve"> alone:</text>
<text x="199.2" y="548" textLength="156" lengthAdjust="spacing" xml:space="preserve"> this only works if </text>
<text x="355.2" y="548" fill="#afd7ff" textLength="15.6" lengthAdjust="spacing" xml:space="preserve">id</text>
<text x="370.8" y="548" textLength="171.6" lengthAdjust="spacing" xml:space="preserve"> order always matches </text>
<text x="542.4" y="548" fill="#afd7ff" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">createdAt</text>
<text x="612.6" y="548" textLength="312" lengthAdjust="spacing" xml:space="preserve"> order. Backdated or imported rows (like</text>
<text x="51" y="565" fill="#afd7ff" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">seed</text>
<text x="82.2" y="565" textLength="23.4" lengthAdjust="spacing" xml:space="preserve">'s </text>
<text x="105.6" y="565" fill="#afd7ff" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">createdAt</text>
<text x="175.8" y="565" textLength="756.6" lengthAdjust="spacing" xml:space="preserve">) break that.                                                                                    </text>
<text x="932.4" y="565" fill="#949494" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">↓</text>
<text x="27.6" y="582" fill="#5fafaf" textLength="904.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text>
<text x="35.4" y="599" fill="#949494" textLength="624" lengthAdjust="spacing" xml:space="preserve">Claude has written up a plan and is ready to execute. Would you like to proceed?</text>
<text x="35.4" y="633" fill="#afd7ff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">❯</text>
<text x="51" y="633" fill="#949494" textLength="23.4" lengthAdjust="spacing" xml:space="preserve">1. </text>
<text x="74.4" y="633" fill="#afd7ff" textLength="171.6" lengthAdjust="spacing" xml:space="preserve">Yes, and use auto mode</text>
<text x="51" y="650" fill="#949494" textLength="23.4" lengthAdjust="spacing" xml:space="preserve">2. </text>
<text x="74.4" y="650" textLength="210.6" lengthAdjust="spacing" xml:space="preserve">Yes, manually approve edits</text>
<text x="51" y="667" fill="#949494" textLength="226.2" lengthAdjust="spacing" xml:space="preserve">3. Tell Claude what to change</text>
<text x="74.4" y="684" fill="#949494" textLength="304.2" lengthAdjust="spacing" xml:space="preserve">shift+tab to approve with this feedback</text>
<text x="35.4" y="718" fill="#949494" textLength="546" lengthAdjust="spacingAndGlyphs" xml:space="preserve">ctrl+g to edit in VS Code · ~/.claude/plans/hidden-soaring-hennessy.md</text>
</g></svg>
