<text x="12" y="72" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="72" textLength="288.6" lengthAdjust="spacing" xml:space="preserve"> Ready. I'm working with you in room </text>
<text x="308.4" y="72" font-weight="bold" textLength="78" lengthAdjust="spacing" xml:space="preserve">bison-3139</text>
<text x="386.4" y="72" textLength="374.4" lengthAdjust="spacing" xml:space="preserve">. The room monitor is running in the background.</text>
<text x="12" y="106" textLength="920.4" lengthAdjust="spacing" xml:space="preserve">  I'll relay any messages or decisions from the orchestrator and other members, handle assignments when they come your</text>
<text x="12" y="123" textLength="421.2" lengthAdjust="spacing" xml:space="preserve">  way, and help you post to the room when you need to.</text>
<text x="12" y="157" textLength="171.6" lengthAdjust="spacing" xml:space="preserve">  What's on your mind?</text>
