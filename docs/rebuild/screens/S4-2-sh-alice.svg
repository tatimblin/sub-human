<text x="66.6" y="259" font-weight="bold" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">orch</text>
<text x="97.8" y="259" textLength="655.2" lengthAdjust="spacing" xml:space="preserve"> (status): Welcome, alice. We're starting with converge: what should this room plan?</text>
<text x="12" y="293" textLength="725.4" lengthAdjust="spacing" xml:space="preserve">  What would you like to tell the room about what this plan should cover? You can reply with </text>
