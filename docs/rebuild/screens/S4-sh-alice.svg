<text x="105.6" y="174" fill="#afd7ff" textLength="78" lengthAdjust="spacing" xml:space="preserve">createTask</text>
<text x="183.6" y="174" textLength="366.6" lengthAdjust="spacing" xml:space="preserve"> uses auto-incrementing IDs via a module-level </text>
<text x="550.2" y="174" fill="#afd7ff" textLength="46.8" lengthAdjust="spacing" xml:space="preserve">nextId</text>
<text x="597" y="174" textLength="351" lengthAdjust="spacing" xml:space="preserve"> counter that starts at 1 and increments with</text>
<text x="12" y="191" textLength="156" lengthAdjust="spacing" xml:space="preserve">  each task created.</text>
