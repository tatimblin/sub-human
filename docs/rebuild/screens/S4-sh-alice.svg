<text x="253.8" y="480" fill="#949494" font-style="italic" textLength="686.4" lengthAdjust="spacing" xml:space="preserve">: Thanks. `nextCursor` (string|null) and &quot;default 50 + max cap&quot; are now in the draft as </text>
