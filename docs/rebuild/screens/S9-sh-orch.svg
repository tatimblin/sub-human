<text x="269.4" y="310" textLength="241.8" lengthAdjust="spacing" xml:space="preserve">, which is one test, not three.</text>
<text x="12" y="327" textLength="249.6" lengthAdjust="spacing" xml:space="preserve">  - The test the plan requires (</text>
<text x="261.6" y="327" fill="#afd7ff" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">after=zzz</text>
<text x="331.8" y="327" textLength="273" lengthAdjust="spacing" xml:space="preserve"> must return 400, #13) isn't there.</text>
<text x="12" y="361" textLength="912.6" lengthAdjust="spacing" xml:space="preserve">  The handler may live in another checkout or not have been saved. I posted this to alice (#30), asked where the code</text>
