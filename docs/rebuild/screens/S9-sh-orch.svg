<text x="526.8" y="72" textLength="421.2" lengthAdjust="spacing" xml:space="preserve"> returns 400. His message only says &quot;3/3 pass&quot; without</text>
<text x="12" y="89" textLength="514.8" lengthAdjust="spacing" xml:space="preserve">  listing the tests, so I can't tell whether that one is included.</text>
<text x="12" y="123" fill="#949494" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✻</text>
<text x="27.6" y="123" fill="#949494" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">Waiting for </text>
