<text x="550.2" y="378" textLength="374.4" lengthAdjust="spacing" xml:space="preserve"> above 50 is cut to 50 or rejected with a 400 is</text>
<text x="12" y="395" textLength="140.4" lengthAdjust="spacing" xml:space="preserve">  also still open.</text>
