<text x="12" y="191" fill="#999999" textLength="163.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ⎿  /plan to preview</text>
<text x="27.6" y="225" fill="#999999" textLength="226.2" lengthAdjust="spacing" xml:space="preserve">Called plugin:sub-human:room </text>
<text x="253.8" y="225" fill="#999999" font-weight="bold" xml:space="preserve">2</text>
<text x="261.6" y="225" fill="#999999" textLength="54.6" lengthAdjust="spacing" xml:space="preserve"> times </text>
<text x="12" y="259" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="259" textLength="811.2" lengthAdjust="spacing" xml:space="preserve"> The paging plan isn't decided yet: alice signed off on the first version (#12), but bob objected (#13).</text>
<text x="12" y="293" textLength="460.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  bob's objection: &quot;add a test for a cursor past the end — </text>
<text x="472.2" y="293" fill="#b1b9f9" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">after=zzz</text>
<text x="542.4" y="293" textLength="725.4" lengthAdjust="spacing" xml:space="preserve"> must 400, not 500&quot;. I revised the plan and proposed version 2 to both of them (#15). It now:</text>
<text x="12" y="310" textLength="195" lengthAdjust="spacing" xml:space="preserve">  - requires a test that </text>
<text x="207" y="310" fill="#b1b9f9" textLength="156" lengthAdjust="spacing" xml:space="preserve">GET /tasks?after=zzz</text>
<text x="363" y="310" textLength="187.2" lengthAdjust="spacing" xml:space="preserve"> returns 400, never 500;</text>
<text x="12" y="327" textLength="366.6" lengthAdjust="spacing" xml:space="preserve">  - separates two cases: a garbled cursor like </text>
<text x="378.6" y="327" fill="#b1b9f9" textLength="23.4" lengthAdjust="spacing" xml:space="preserve">zzz</text>
<text x="402" y="327" textLength="850.2" lengthAdjust="spacing" xml:space="preserve"> returns 400, while a valid cursor that points past the last task returns an empty page, as alice said in #8.</text>
<text x="12" y="361" textLength="1177.8" lengthAdjust="spacing" xml:space="preserve">  Version 2 replaces version 1, so alice's sign-off no longer counts. Both of them need to answer the new card, and I explained this in the room (#16).</text>
<text x="12" y="395" textLength="405.6" lengthAdjust="spacing" xml:space="preserve">  One question is still open in the plan: whether a </text>
<text x="417.6" y="395" fill="#b1b9f9" textLength="39" lengthAdjust="spacing" xml:space="preserve">limit</text>
<text x="456.6" y="395" textLength="413.4" lengthAdjust="spacing" xml:space="preserve"> above 50 gets cut down to 50 or rejected with a 400.</text>
<text x="12" y="429" fill="#999999" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✻</text>
<text x="27.6" y="429" fill="#999999" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">Waiting for </text>
<text x="121.2" y="429" fill="#999999" font-weight="bold" xml:space="preserve">2</text>
<text x="129" y="429" fill="#999999" textLength="218.4" lengthAdjust="spacing" xml:space="preserve"> background agents to finish</text>
<text x="12" y="463" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="463" textLength="312" lengthAdjust="spacing" xml:space="preserve"> Monitor event: &quot;sub-human room notices&quot;</text>
<text x="27.6" y="497" fill="#999999" textLength="226.2" lengthAdjust="spacing" xml:space="preserve">Called plugin:sub-human:room </text>
<text x="12" y="531" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="531" textLength="163.8" lengthAdjust="spacing" xml:space="preserve"> The paging plan for </text>
<text x="183.6" y="531" fill="#b1b9f9" textLength="78" lengthAdjust="spacing" xml:space="preserve">GET /tasks</text>
<text x="261.6" y="531" textLength="858" lengthAdjust="spacing" xml:space="preserve"> is decided: alice (#17) and bob (#18) both signed off on version 2, and the room recorded the decision (#19).</text>
<text x="12" y="565" textLength="553.8" lengthAdjust="spacing" xml:space="preserve">  I posted it to the room (#20) and flagged two things still to settle:</text>
<text x="12" y="582" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">  - </text>
<text x="43.2" y="582" font-weight="bold" textLength="109.2" lengthAdjust="spacing" xml:space="preserve">Open question:</text>
<text x="152.4" y="582" textLength="31.2" lengthAdjust="spacing" xml:space="preserve"> if </text>
<text x="183.6" y="582" fill="#b1b9f9" textLength="39" lengthAdjust="spacing" xml:space="preserve">limit</text>
<text x="222.6" y="582" textLength="1154.4" lengthAdjust="spacing" xml:space="preserve"> is over 50 or not a whole number, does the API cut it to 50 or return a 400? Neither of them has said, so the handler shouldn't ship until they do.</text>
<text x="12" y="599" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">  - </text>
<text x="43.2" y="599" font-weight="bold" textLength="85.8" lengthAdjust="spacing" xml:space="preserve">Work split:</text>
<text x="129" y="599" textLength="717.6" lengthAdjust="spacing" xml:space="preserve"> bob said in #4 he'd take the tests once paging was agreed. Nobody has taken the handler in </text>
<text x="846.6" y="599" fill="#b1b9f9" textLength="101.4" lengthAdjust="spacing" xml:space="preserve">src/server.js</text>
<text x="948" y="599" textLength="39" lengthAdjust="spacing" xml:space="preserve"> yet.</text>
<text x="12" y="633" textLength="936" lengthAdjust="spacing" xml:space="preserve">  Nobody has sent a task request, so the room's task list is unchanged. I'll wait for task requests or further messages.</text>
<text x="12" y="667" fill="#999999" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✻</text>
