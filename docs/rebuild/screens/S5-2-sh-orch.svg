<g fill="#d6dbe5">
<text x="12" y="72" textLength="335.4" lengthAdjust="spacing" xml:space="preserve">  The plan uses the details they each gave:</text>
<text x="12" y="89" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">  - </text>
<text x="43.2" y="89" font-weight="bold" textLength="46.8" lengthAdjust="spacing" xml:space="preserve">Order:</text>
<text x="90" y="89" textLength="140.4" lengthAdjust="spacing" xml:space="preserve"> newest first, by </text>
<text x="230.4" y="89" fill="#b1b9f9" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">createdAt</text>
<text x="300.6" y="89" textLength="46.8" lengthAdjust="spacing" xml:space="preserve"> then </text>
<text x="347.4" y="89" fill="#b1b9f9" textLength="15.6" lengthAdjust="spacing" xml:space="preserve">id</text>
<text x="363" y="89" textLength="304.2" lengthAdjust="spacing" xml:space="preserve">, because some tasks share a timestamp.</text>
<text x="12" y="106" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">  - </text>
<text x="43.2" y="106" font-weight="bold" textLength="46.8" lengthAdjust="spacing" xml:space="preserve">Limit:</text>
<text x="90" y="106" textLength="249.6" lengthAdjust="spacing" xml:space="preserve"> default 20, max 50 (alice, #8).</text>
<text x="12" y="123" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">  - </text>
<text x="43.2" y="123" font-weight="bold" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">Response:</text>
<text x="121.2" y="123" fill="#b1b9f9" textLength="148.2" lengthAdjust="spacing" xml:space="preserve">{items, nextCursor}</text>
<text x="269.4" y="123" textLength="62.4" lengthAdjust="spacing" xml:space="preserve">, where </text>
<text x="331.8" y="123" fill="#b1b9f9" textLength="78" lengthAdjust="spacing" xml:space="preserve">nextCursor</text>
<text x="409.8" y="123" textLength="390" lengthAdjust="spacing" xml:space="preserve"> is null when there are no more pages (alice, #8).</text>
<text x="12" y="140" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">  - </text>
<text x="43.2" y="140" font-weight="bold" textLength="156" lengthAdjust="spacing" xml:space="preserve">Cursor past the end:</text>
<text x="199.2" y="140" textLength="273" lengthAdjust="spacing" xml:space="preserve"> returns an empty page (alice, #8).</text>
<text x="12" y="157" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">  - </text>
<text x="43.2" y="157" font-weight="bold" textLength="132.6" lengthAdjust="spacing" xml:space="preserve">Malformed cursor:</text>
<text x="175.8" y="157" textLength="195" lengthAdjust="spacing" xml:space="preserve"> returns a 400 (bob, #9).</text>
<text x="12" y="191" textLength="405.6" lengthAdjust="spacing" xml:space="preserve">  One question is still open in the plan: whether a </text>
<text x="417.6" y="191" fill="#b1b9f9" textLength="39" lengthAdjust="spacing" xml:space="preserve">limit</text>
<text x="456.6" y="191" textLength="1068.6" lengthAdjust="spacing" xml:space="preserve"> above 50 (or not a positive number) gets cut down to 50 or rejected with a 400. Neither of them has said, so I didn't pick one. They can</text>
<text x="12" y="208" textLength="374.4" lengthAdjust="spacing" xml:space="preserve">  settle it in the room or in their card's note.</text>
<text x="12" y="242" textLength="1248" lengthAdjust="spacing" xml:space="preserve">  The plan is decided only once the room records both card answers. Then I can help split the work: bob has offered to write the tests (#4), and the handler in </text>
<text x="1260" y="242" fill="#b1b9f9" textLength="101.4" lengthAdjust="spacing" xml:space="preserve">src/server.js</text>
<text x="1361.4" y="242" textLength="140.4" lengthAdjust="spacing" xml:space="preserve"> has no owner yet.</text>
<text x="12" y="276" fill="#999999" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✻</text>
<text x="27.6" y="276" fill="#999999" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">Waiting for </text>
<text x="121.2" y="276" fill="#999999" font-weight="bold" xml:space="preserve">2</text>
<text x="129" y="276" fill="#999999" textLength="218.4" lengthAdjust="spacing" xml:space="preserve"> background agents to finish</text>
<text x="12" y="310" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="310" textLength="312" lengthAdjust="spacing" xml:space="preserve"> Monitor event: &quot;sub-human room notices&quot;</text>
<text x="12" y="344" fill="#4eba65" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="27.6" y="344" font-weight="bold" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">Updated plan</text>
<text x="12" y="361" fill="#999999" textLength="163.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ⎿  /plan to preview</text>
<text x="12" y="395" fill="#4eba65" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="27.6" y="395" font-weight="bold" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">Updated plan</text>
<text x="12" y="412" fill="#999999" textLength="163.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ⎿  /plan to preview</text>
<text x="12" y="446" fill="#4eba65" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="27.6" y="446" font-weight="bold" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">Updated plan</text>
<text x="12" y="463" fill="#999999" textLength="163.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ⎿  /plan to preview</text>
<text x="27.6" y="497" fill="#999999" textLength="226.2" lengthAdjust="spacing" xml:space="preserve">Called plugin:sub-human:room </text>
<text x="253.8" y="497" fill="#999999" font-weight="bold" xml:space="preserve">2</text>
<text x="261.6" y="497" fill="#999999" textLength="54.6" lengthAdjust="spacing" xml:space="preserve"> times </text>
<text x="12" y="531" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="531" textLength="811.2" lengthAdjust="spacing" xml:space="preserve"> The paging plan isn't decided yet: alice signed off on the first version (#12), but bob objected (#13).</text>
<text x="12" y="565" textLength="460.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  bob's objection: &quot;add a test for a cursor past the end — </text>
<text x="472.2" y="565" fill="#b1b9f9" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">after=zzz</text>
<text x="542.4" y="565" textLength="725.4" lengthAdjust="spacing" xml:space="preserve"> must 400, not 500&quot;. I revised the plan and proposed version 2 to both of them (#15). It now:</text>
<text x="12" y="582" textLength="195" lengthAdjust="spacing" xml:space="preserve">  - requires a test that </text>
<text x="207" y="582" fill="#b1b9f9" textLength="156" lengthAdjust="spacing" xml:space="preserve">GET /tasks?after=zzz</text>
<text x="363" y="582" textLength="187.2" lengthAdjust="spacing" xml:space="preserve"> returns 400, never 500;</text>
<text x="12" y="599" textLength="366.6" lengthAdjust="spacing" xml:space="preserve">  - separates two cases: a garbled cursor like </text>
<text x="378.6" y="599" fill="#b1b9f9" textLength="23.4" lengthAdjust="spacing" xml:space="preserve">zzz</text>
<text x="402" y="599" textLength="850.2" lengthAdjust="spacing" xml:space="preserve"> returns 400, while a valid cursor that points past the last task returns an empty page, as alice said in #8.</text>
<text x="12" y="633" textLength="1177.8" lengthAdjust="spacing" xml:space="preserve">  Version 2 replaces version 1, so alice's sign-off no longer counts. Both of them need to answer the new card, and I explained this in the room (#16).</text>
<text x="12" y="667" textLength="405.6" lengthAdjust="spacing" xml:space="preserve">  One question is still open in the plan: whether a </text>
<text x="417.6" y="667" fill="#b1b9f9" textLength="39" lengthAdjust="spacing" xml:space="preserve">limit</text>
<text x="456.6" y="667" textLength="413.4" lengthAdjust="spacing" xml:space="preserve"> above 50 gets cut down to 50 or rejected with a 400.</text>
<text x="12" y="684" fill="#d77757" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✻</text>
<text x="27.6" y="684" fill="#e49070" textLength="163.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">room stoat-3644 open…</text>
<text x="199.2" y="684" fill="#999999" textLength="62.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">(14s · ↓</text>
<text x="269.4" y="684" fill="#999999" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">1.3k tokens)</text>
<text x="12" y="701" fill="#d77757" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✶</text>
<text x="27.6" y="701" fill="#d77757" textLength="171.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">room stoat-3644 open… </text>
<text x="199.2" y="701" fill="#999999" textLength="62.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">(16s · ↓</text>
<text x="269.4" y="701" fill="#999999" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">1.4k tokens)</text>
