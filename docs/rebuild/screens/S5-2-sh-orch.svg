<text x="12" y="55" textLength="936" lengthAdjust="spacing" xml:space="preserve">  That conflicts with Alice's proposal (#4) to return a bare array. With an opaque cursor, the client can't work out the</text>
<text x="12" y="72" textLength="881.4" lengthAdjust="spacing" xml:space="preserve">  next one from the last item, so the response has to hand it back somewhere. A bare array has no field for that.</text>
<text x="12" y="106" textLength="702" lengthAdjust="spacing" xml:space="preserve">  I asked Alice (#7) which she prefers: put the next cursor in a response header (such as </text>
<text x="714" y="106" fill="#afd7ff" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">Link</text>
<text x="745.2" y="106" textLength="31.2" lengthAdjust="spacing" xml:space="preserve"> or </text>
<text x="776.4" y="106" fill="#afd7ff" textLength="101.4" lengthAdjust="spacing" xml:space="preserve">X-Next-Cursor</text>
<text x="877.8" y="106" textLength="39" lengthAdjust="spacing" xml:space="preserve">), or</text>
<text x="12" y="123" textLength="421.2" lengthAdjust="spacing" xml:space="preserve">  change the body shape. The plan waits on her answer.</text>
<text x="12" y="157" textLength="741" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ┌────────────────────────────┬────────┬──────────────────────────────────┬──────────────────┐</text>
