<text x="12" y="480" fill="#999999" textLength="163.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ⎿  /plan to preview</text>
<text x="12" y="514" fill="#4eba65" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="27.6" y="514" font-weight="bold" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">Updated plan</text>
<text x="12" y="531" fill="#999999" textLength="163.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ⎿  /plan to preview</text>
<text x="27.6" y="565" fill="#999999" textLength="226.2" lengthAdjust="spacing" xml:space="preserve">Called plugin:sub-human:room </text>
<text x="12" y="599" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="599" textLength="1458.6" lengthAdjust="spacing" xml:space="preserve"> Bob objected to the first paging plan (#8), so I revised it and sent it out again as #10. Bob and alice each need to answer the new card, and alice's earlier sign-off doesn't carry over.</text>
<text x="12" y="633" textLength="405.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  His note: &quot;add a test for a cursor past the end — </text>
<text x="417.6" y="633" fill="#b1b9f9" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">after=zzz</text>
<text x="487.8" y="633" textLength="304.2" lengthAdjust="spacing" xml:space="preserve"> must 400, not 500&quot;. The revision adds:</text>
<text x="12" y="650" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">  - </text>
<text x="43.2" y="650" font-weight="bold" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">His test:</text>
<text x="121.2" y="650" fill="#b1b9f9" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">after=zzz</text>
<text x="191.4" y="650" textLength="592.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> must return 400. A cursor that can't be read always returns 400, never 500.</text>
<text x="12" y="667" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">  - </text>
<text x="43.2" y="667" font-weight="bold" textLength="171.6" lengthAdjust="spacing" xml:space="preserve">A second test I added:</text>
<text x="214.8" y="667" textLength="1146.6" lengthAdjust="spacing" xml:space="preserve"> a valid cursor pointing past the oldest task returns an empty page with no next cursor. His note mixed the two cases, so the plan now covers both.</text>
<text x="12" y="684" fill="#d77757" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✻</text>
<text x="27.6" y="684" fill="#d77757" textLength="171.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">room gecko-5061 open… </text>
