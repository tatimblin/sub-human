<text x="51" y="718" fill="#d77757" textLength="15.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">◼ </text>
<text x="66.6" y="718" font-weight="bold" textLength="46.8" lengthAdjust="spacing" xml:space="preserve">room s</text>
<text x="121.2" y="718" font-weight="bold" textLength="101.4" lengthAdjust="spacing" xml:space="preserve">oat-3644 open</text>
