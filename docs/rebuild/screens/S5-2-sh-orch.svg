<text x="27.6" y="72" fill="#999999" textLength="101.4" lengthAdjust="spacing" xml:space="preserve">Searched for </text>
<text x="129" y="72" fill="#999999" font-weight="bold" xml:space="preserve">1</text>
<text x="136.8" y="72" fill="#999999" textLength="117" lengthAdjust="spacing" xml:space="preserve"> pattern, read </text>
<text x="253.8" y="72" fill="#999999" font-weight="bold" xml:space="preserve">5</text>
<text x="261.6" y="72" fill="#999999" textLength="54.6" lengthAdjust="spacing" xml:space="preserve"> files </text>
<text x="12" y="106" fill="#4eba65" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="27.6" y="106" font-weight="bold" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">Updated plan</text>
<text x="12" y="123" fill="#999999" textLength="163.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ⎿  /plan to preview</text>
<text x="27.6" y="157" fill="#999999" textLength="226.2" lengthAdjust="spacing" xml:space="preserve">Called plugin:sub-human:room </text>
<text x="12" y="191" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="191" textLength="928.2" lengthAdjust="spacing" xml:space="preserve"> Bob and alice each have an approval card open for the GET /tasks paging plan (proposal #6), which bob asked for in #5.</text>
<text x="12" y="225" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">  - </text>
<text x="43.2" y="225" font-weight="bold" textLength="54.6" lengthAdjust="spacing" xml:space="preserve">Design:</text>
<text x="97.8" y="225" textLength="304.2" lengthAdjust="spacing" xml:space="preserve"> results are sorted newest first, with </text>
<text x="402" y="225" fill="#b1b9f9" textLength="15.6" lengthAdjust="spacing" xml:space="preserve">id</text>
<text x="417.6" y="225" textLength="140.4" lengthAdjust="spacing" xml:space="preserve"> breaking ties on </text>
<text x="558" y="225" fill="#b1b9f9" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">createdAt</text>
<text x="628.2" y="225" textLength="343.2" lengthAdjust="spacing" xml:space="preserve">. The opaque cursor encodes the last item's </text>
<text x="971.4" y="225" fill="#b1b9f9" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">createdAt</text>
<text x="1041.6" y="225" textLength="39" lengthAdjust="spacing" xml:space="preserve"> and </text>
<text x="1080.6" y="225" fill="#b1b9f9" textLength="15.6" lengthAdjust="spacing" xml:space="preserve">id</text>
<text x="1096.2" y="225" textLength="429" lengthAdjust="spacing" xml:space="preserve">, so new inserts don't make pages skip or repeat rows. </text>
<text x="1525.2" y="225" fill="#b1b9f9" textLength="39" lengthAdjust="spacing" xml:space="preserve">limit</text>
<text x="12" y="242" textLength="327.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    defaults to 20, with a maximum of 100.</text>
<text x="12" y="259" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">  - </text>
<text x="43.2" y="259" font-weight="bold" textLength="210.6" lengthAdjust="spacing" xml:space="preserve">Open questions in the plan:</text>
<text x="12" y="276" textLength="124.8" lengthAdjust="spacing" xml:space="preserve">    - Whether a </text>
<text x="136.8" y="276" fill="#b1b9f9" textLength="39" lengthAdjust="spacing" xml:space="preserve">limit</text>
<text x="175.8" y="276" textLength="374.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> above 100 returns an error or is capped at 100.</text>
<text x="12" y="293" textLength="273" lengthAdjust="spacing" xml:space="preserve">    - Whether results come back as </text>
<text x="285" y="293" fill="#b1b9f9" textLength="148.2" lengthAdjust="spacing" xml:space="preserve">{items, nextCursor}</text>
<text x="433.2" y="293" textLength="319.8" lengthAdjust="spacing" xml:space="preserve"> or as a plain list with the cursor in a </text>
<text x="753" y="293" fill="#b1b9f9" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">Link</text>
<text x="784.2" y="293" textLength="62.4" lengthAdjust="spacing" xml:space="preserve"> header.</text>
<text x="12" y="310" textLength="351" lengthAdjust="spacing" xml:space="preserve">    - Whether paging backwards is needed now.</text>
<text x="12" y="327" textLength="319.8" lengthAdjust="spacing" xml:space="preserve">    - Whether alice takes the handler in </text>
<text x="331.8" y="327" fill="#b1b9f9" textLength="101.4" lengthAdjust="spacing" xml:space="preserve">src/server.js</text>
<text x="433.2" y="327" textLength="273" lengthAdjust="spacing" xml:space="preserve"> while bob writes the parser tests.</text>
<text x="12" y="361" textLength="257.4" lengthAdjust="spacing" xml:space="preserve">  Nobody has answered a card yet.</text>
<text x="12" y="395" fill="#999999" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✻</text>
<text x="27.6" y="395" fill="#999999" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">Waiting for </text>
<text x="121.2" y="395" fill="#999999" font-weight="bold" xml:space="preserve">2</text>
<text x="129" y="395" fill="#999999" textLength="218.4" lengthAdjust="spacing" xml:space="preserve"> background agents to finish</text>
<text x="12" y="429" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="429" textLength="312" lengthAdjust="spacing" xml:space="preserve"> Monitor event: &quot;sub-human room notices&quot;</text>
<text x="12" y="446" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">   o</text>
<text x="12" y="463" fill="#4eba65" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
