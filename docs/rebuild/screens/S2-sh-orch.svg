<text x="12" y="191" fill="#949494" textLength="912.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ⎿  UserPromptExpansion says: room vole-8126 open · others join with: /sub-human NAME (or /sub-human NAME vole-8126)</text>
<text x="12" y="225" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="225" textLength="546" lengthAdjust="spacing" xml:space="preserve"> Room vole-8126 is open, and no one has joined yet. Members join with </text>
<text x="565.8" y="225" fill="#afd7ff" textLength="195" lengthAdjust="spacing" xml:space="preserve">/sub-human NAME vole-8126</text>
<text x="760.8" y="225" textLength="163.8" lengthAdjust="spacing" xml:space="preserve">. When someone joins,</text>
<text x="12" y="242" textLength="397.8" lengthAdjust="spacing" xml:space="preserve">  I'll start a row for them and begin facilitating.</text>
<text x="12" y="276" fill="#949494" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✻</text>
<text x="27.6" y="276" fill="#949494" textLength="421.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Baked for 3s · done 11:56 AM · 1 monitor still running</text>
