<text x="19.8" y="429" textLength="912.6" lengthAdjust="spacing" xml:space="preserve"> Alice has joined room vole-8126. I started her row and posted her a welcome. It says we're in the converge phase and</text>
<text x="12" y="446" textLength="928.2" lengthAdjust="spacing" xml:space="preserve">  asks what she wants the room to plan. There's no plan yet, so there was no plan hash to send her. I'm waiting for her</text>
