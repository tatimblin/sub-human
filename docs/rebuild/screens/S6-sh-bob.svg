<text x="503.4" y="480" textLength="413.4" lengthAdjust="spacing" xml:space="preserve"> must return 400, not 500 (plan lines 18 and 43). One</text>
<text x="12" y="497" textLength="936" lengthAdjust="spacing" xml:space="preserve">  question is still open in the plan (line 27): whether 20 is the right default limit and 100 the right max, and whether</text>
<text x="12" y="514" textLength="460.2" lengthAdjust="spacing" xml:space="preserve">  a limit above 100 should return 400 or be clamped to 100.</text>
<text x="12" y="548" textLength="741" lengthAdjust="spacing" xml:space="preserve">  You said in #4 you'd take the parser tests once paging was agreed. Want me to start on those?</text>
