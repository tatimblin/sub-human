<text x="90" y="140" font-weight="bold" textLength="117" lengthAdjust="spacing" xml:space="preserve"> is raw task ID</text>
<text x="207" y="140" textLength="382.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — orch is asking you (#22): does a bare ID like </text>
<text x="589.2" y="140" fill="#afd7ff" textLength="54.6" lengthAdjust="spacing" xml:space="preserve">after=7</text>
<text x="643.8" y="140" textLength="304.2" lengthAdjust="spacing" xml:space="preserve"> count as opaque, or does it need to be</text>
<text x="12" y="157" textLength="171.6" lengthAdjust="spacing" xml:space="preserve">     encoded (base64)?</text>
<text x="12" y="174" textLength="39" lengthAdjust="spacing" xml:space="preserve">  3. </text>
<text x="51" y="174" font-weight="bold" textLength="62.4" lengthAdjust="spacing" xml:space="preserve">Unknown </text>
<text x="113.4" y="174" fill="#afd7ff" font-weight="bold" textLength="39" lengthAdjust="spacing" xml:space="preserve">after</text>
<text x="152.4" y="174" font-weight="bold" textLength="140.4" lengthAdjust="spacing" xml:space="preserve"> restarts silently</text>
<text x="292.8" y="174" textLength="288.6" lengthAdjust="spacing" xml:space="preserve"> at first page (infinite loop risk); </text>
<text x="581.4" y="174" fill="#afd7ff" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">limit=abc</text>
<text x="651.6" y="174" textLength="70.2" lengthAdjust="spacing" xml:space="preserve"> returns </text>
