<text x="12" y="344" textLength="678.6" lengthAdjust="spacing" xml:space="preserve">    returning 200 with 50 items, an invalid cursor, and existing callers still working.</text>
<text x="12" y="378" textLength="889.2" lengthAdjust="spacing" xml:space="preserve">  The work is done when bob's tests pass against alice's handler and both of them post test counts and file paths.</text>
