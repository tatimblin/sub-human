<text x="19.8" y="497" textLength="249.6" lengthAdjust="spacing" xml:space="preserve"> Monitor event: &quot;sub-human room&quot;</text>
<text x="12" y="531" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="531" textLength="865.8" lengthAdjust="spacing" xml:space="preserve"> orch (to you): Couldn't mark &quot;cursor paging handler&quot; done: it's claimed by alice, so only her done request can</text>
