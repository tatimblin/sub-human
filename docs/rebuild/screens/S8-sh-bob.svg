<text x="12" y="55" textLength="234" lengthAdjust="spacing" xml:space="preserve">     3. Is the response shape </text>
<text x="246" y="55" fill="#afd7ff" textLength="156" lengthAdjust="spacing" xml:space="preserve">{items, next_cursor}</text>
<text x="402" y="55" textLength="351" lengthAdjust="spacing" xml:space="preserve"> right, or do you want a different key (e.g. </text>
