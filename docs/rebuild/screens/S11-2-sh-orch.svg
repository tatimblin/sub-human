<text x="12" y="55" textLength="366.6" lengthAdjust="spacing" xml:space="preserve">  What it describes matches the decision (#18):</text>
<text x="12" y="72" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">  - </text>
<text x="43.2" y="72" fill="#afd7ff" textLength="39" lengthAdjust="spacing" xml:space="preserve">after</text>
<text x="82.2" y="72" textLength="475.8" lengthAdjust="spacing" xml:space="preserve"> is an opaque base64 cursor, and the body stays a bare array.</text>
<text x="12" y="89" textLength="46.8" lengthAdjust="spacing" xml:space="preserve">  - A </text>
<text x="58.8" y="89" fill="#afd7ff" textLength="39" lengthAdjust="spacing" xml:space="preserve">limit</text>
<text x="97.8" y="89" textLength="218.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> above 50 is cut down to 50.</text>
<text x="12" y="106" textLength="561.6" lengthAdjust="spacing" xml:space="preserve">  - Pages come in a stable order (newest first, with ties broken by id).</text>
<text x="12" y="123" textLength="249.6" lengthAdjust="spacing" xml:space="preserve">  - The next page is given in a </text>
<text x="261.6" y="123" fill="#afd7ff" textLength="101.4" lengthAdjust="spacing" xml:space="preserve">Link rel=next</text>
<text x="363" y="123" textLength="62.4" lengthAdjust="spacing" xml:space="preserve"> header.</text>
<text x="12" y="157" textLength="452.4" lengthAdjust="spacing" xml:space="preserve">  It also settles one open question by making the default </text>
<text x="464.4" y="157" fill="#afd7ff" textLength="39" lengthAdjust="spacing" xml:space="preserve">limit</text>
<text x="503.4" y="157" textLength="31.2" lengthAdjust="spacing" xml:space="preserve"> 15.</text>
<text x="12" y="191" textLength="335.4" lengthAdjust="spacing" xml:space="preserve">  Her report doesn't say what happens when </text>
<text x="347.4" y="191" fill="#afd7ff" textLength="39" lengthAdjust="spacing" xml:space="preserve">after</text>
<text x="386.4" y="191" textLength="561.6" lengthAdjust="spacing" xml:space="preserve"> is garbage or has been tampered with, which is the other open question.</text>
<text x="12" y="208" textLength="241.8" lengthAdjust="spacing" xml:space="preserve">  I asked her about that (#22).</text>
<text x="12" y="242" textLength="319.8" lengthAdjust="spacing" xml:space="preserve">  Bob still hasn't reported on his tests.</text>
<text x="12" y="276" fill="#949494" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✻</text>
<text x="27.6" y="276" fill="#949494" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">Waiting for </text>
<text x="121.2" y="276" fill="#949494" font-weight="bold" xml:space="preserve">2</text>
<text x="129" y="276" fill="#949494" textLength="218.4" lengthAdjust="spacing" xml:space="preserve"> background agents to finish</text>
<text x="12" y="310" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="310" textLength="312" lengthAdjust="spacing" xml:space="preserve"> Monitor event: &quot;sub-human room notices&quot;</text>
<text x="27.6" y="344" fill="#949494" textLength="226.2" lengthAdjust="spacing" xml:space="preserve">Called plugin:sub-human:room </text>
<text x="12" y="378" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="378" textLength="312" lengthAdjust="spacing" xml:space="preserve"> Monitor event: &quot;sub-human room notices&quot;</text>
