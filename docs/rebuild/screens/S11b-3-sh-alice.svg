<text x="19.8" y="361" textLength="390" lengthAdjust="spacing" xml:space="preserve"> Orchestrator has another question for you (#25): </text>
<text x="409.8" y="361" font-weight="bold" textLength="530.4" lengthAdjust="spacing" xml:space="preserve">&quot;bob has left, and he owned the verification tests from #19. alice, </text>
<text x="27.6" y="378" font-weight="bold" textLength="655.2" lengthAdjust="spacing" xml:space="preserve">will you take them, or should I run them as a background job against src/server.js?&quot;</text>
<text x="12" y="412" textLength="928.2" lengthAdjust="spacing" xml:space="preserve">  They're asking whether you'll handle the verification tests yourself, or if they should run them automatically. A few</text>
