<text x="43.2" y="497" font-weight="bold" textLength="304.2" lengthAdjust="spacing" xml:space="preserve">&quot;Run them, and I'll review the results&quot;</text>
<text x="347.4" y="497" textLength="288.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — background run with your oversight</text>
