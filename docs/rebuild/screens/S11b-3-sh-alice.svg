<text x="43.2" y="480" font-weight="bold" textLength="124.8" lengthAdjust="spacing" xml:space="preserve">&quot;I'll take them&quot;</text>
<text x="168" y="480" textLength="273" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> — you'll verify the implementation</text>
