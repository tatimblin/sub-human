<text x="12" y="55" textLength="171.6" lengthAdjust="spacing" xml:space="preserve">    c. How an invalid </text>
<text x="183.6" y="55" fill="#afd7ff" textLength="39" lengthAdjust="spacing" xml:space="preserve">after</text>
<text x="222.6" y="55" textLength="93.6" lengthAdjust="spacing" xml:space="preserve"> is handled.</text>
<text x="12" y="72" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">  - </text>
<text x="43.2" y="72" font-weight="bold" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">bob:</text>
<text x="74.4" y="72" textLength="733.2" lengthAdjust="spacing" xml:space="preserve"> the contract tests and review. The tests cover the first page, the next page, the last page, </text>
<text x="807.6" y="72" fill="#afd7ff" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">limit=500</text>
<text x="12" y="89" textLength="678.6" lengthAdjust="spacing" xml:space="preserve">    returning 200 with 50 items, an invalid cursor, and existing callers still working.</text>
<text x="12" y="123" textLength="889.2" lengthAdjust="spacing" xml:space="preserve">  The work is done when bob's tests pass against alice's handler and both of them post test counts and file paths.</text>
<text x="12" y="140" textLength="850.2" lengthAdjust="spacing" xml:space="preserve">  Nothing has been built yet; the next step is alice's handler path and her answers to those three questions.</text>
<text x="12" y="174" fill="#949494" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✻</text>
<text x="27.6" y="174" fill="#949494" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">Waiting for </text>
<text x="121.2" y="174" fill="#949494" font-weight="bold" xml:space="preserve">2</text>
<text x="129" y="174" fill="#949494" textLength="218.4" lengthAdjust="spacing" xml:space="preserve"> background agents to finish</text>
<text x="12" y="208" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="208" textLength="312" lengthAdjust="spacing" xml:space="preserve"> Monitor event: &quot;sub-human room notices&quot;</text>
<text x="12" y="242" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="242" textLength="865.8" lengthAdjust="spacing" xml:space="preserve"> alice's Claude reported in #19 that she has started on the server change, so I didn't reply. Her handler is at</text>
<text x="27.6" y="259" fill="#afd7ff" textLength="312" lengthAdjust="spacing" xml:space="preserve">/private/tmp/sh-demo/alice/src/server.js</text>
<text x="339.6" y="259" textLength="608.4" lengthAdjust="spacing" xml:space="preserve"> (from line 28). She says the cursor is an opaque marker based on the task ID,</text>
<text x="27.6" y="276" fill="#afd7ff" textLength="39" lengthAdjust="spacing" xml:space="preserve">limit</text>
<text x="66.6" y="276" textLength="413.4" lengthAdjust="spacing" xml:space="preserve"> clamps to 50, and results come back newest-first by </text>
<text x="480" y="276" fill="#afd7ff" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">createdAt</text>
<text x="550.2" y="276" textLength="241.8" lengthAdjust="spacing" xml:space="preserve">. Testing is still in progress.</text>
<text x="12" y="310" textLength="335.4" lengthAdjust="spacing" xml:space="preserve">  She hasn't yet said what happens when no </text>
<text x="347.4" y="310" fill="#afd7ff" textLength="39" lengthAdjust="spacing" xml:space="preserve">limit</text>
<text x="386.4" y="310" textLength="140.4" lengthAdjust="spacing" xml:space="preserve"> is given or when </text>
<text x="526.8" y="310" fill="#afd7ff" textLength="39" lengthAdjust="spacing" xml:space="preserve">after</text>
<text x="565.8" y="310" textLength="374.4" lengthAdjust="spacing" xml:space="preserve"> is invalid. I've already asked once (#18), so I</text>
<text x="12" y="327" textLength="218.4" lengthAdjust="spacing" xml:space="preserve">  won't send a reminder yet.</text>
<text x="12" y="361" textLength="865.8" lengthAdjust="spacing" xml:space="preserve">  When she reports done, I'll check whether a cursor built from the task ID stays opaque, since bob made that a</text>
<text x="12" y="378" textLength="195" lengthAdjust="spacing" xml:space="preserve">  condition in #4 and #6.</text>
<text x="12" y="412" fill="#949494" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✻</text>
<text x="27.6" y="412" fill="#949494" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">Waiting for </text>
<text x="121.2" y="412" fill="#949494" font-weight="bold" xml:space="preserve">2</text>
<text x="129" y="412" fill="#949494" textLength="218.4" lengthAdjust="spacing" xml:space="preserve"> background agents to finish</text>
