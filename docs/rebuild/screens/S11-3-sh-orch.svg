<text x="12" y="72" textLength="210.6" lengthAdjust="spacing" xml:space="preserve">  She also set the default </text>
<text x="222.6" y="72" fill="#afd7ff" textLength="39" lengthAdjust="spacing" xml:space="preserve">limit</text>
<text x="261.6" y="72" textLength="600.6" lengthAdjust="spacing" xml:space="preserve"> to 10, which answers an open question, but the room hasn't agreed to it yet.</text>
<text x="12" y="106" textLength="780" lengthAdjust="spacing" xml:space="preserve">  I asked alice in #22 whether she'll fix these or wants the room to accept them as a plan revision.</text>
<text x="12" y="140" textLength="218.4" lengthAdjust="spacing" xml:space="preserve">  The tests are her own, in </text>
<text x="230.4" y="140" fill="#afd7ff" textLength="148.2" lengthAdjust="spacing" xml:space="preserve">test/health.test.js</text>
<text x="378.6" y="140" textLength="569.4" lengthAdjust="spacing" xml:space="preserve">. Bob was meant to write the tests from the plan's verification list, but</text>
<text x="12" y="157" textLength="280.8" lengthAdjust="spacing" xml:space="preserve">  he hasn't confirmed that part yet.</text>
<text x="12" y="191" fill="#949494" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✻</text>
<text x="27.6" y="191" fill="#949494" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">Waiting for </text>
<text x="121.2" y="191" fill="#949494" font-weight="bold" xml:space="preserve">2</text>
<text x="129" y="191" fill="#949494" textLength="218.4" lengthAdjust="spacing" xml:space="preserve"> background agents to finish</text>
<text x="12" y="225" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="225" textLength="312" lengthAdjust="spacing" xml:space="preserve"> Monitor event: &quot;sub-human room notices&quot;</text>
<text x="27.6" y="259" fill="#949494" textLength="226.2" lengthAdjust="spacing" xml:space="preserve">Called plugin:sub-human:room </text>
<text x="12" y="293" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="293" textLength="312" lengthAdjust="spacing" xml:space="preserve"> Monitor event: &quot;sub-human room notices&quot;</text>
<text x="27.6" y="327" fill="#949494" textLength="226.2" lengthAdjust="spacing" xml:space="preserve">Called plugin:sub-human:room </text>
<text x="12" y="361" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="361" textLength="904.8" lengthAdjust="spacing" xml:space="preserve"> Bob left the room (#23) and then came back almost immediately (#24). His row was still running, so I didn't start a</text>
<text x="12" y="378" textLength="78" lengthAdjust="spacing" xml:space="preserve">  new one.</text>
<text x="12" y="412" textLength="920.4" lengthAdjust="spacing" xml:space="preserve">  My post #25 went out after his return without my knowing. It told alice he was gone and asked whether she or I would</text>
<text x="12" y="429" textLength="912.6" lengthAdjust="spacing" xml:space="preserve">  take over his verification tests. I followed up with #26, telling bob to ignore #25: he is still an approver of the</text>
<text x="12" y="446" textLength="748.8" lengthAdjust="spacing" xml:space="preserve">  decided plan (eaae7e5e855a), he still has the tests, and my review of alice's build is in #22.</text>
<text x="12" y="480" textLength="148.2" lengthAdjust="spacing" xml:space="preserve">  Still waiting on:</text>
<text x="12" y="497" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">  - </text>
<text x="43.2" y="497" font-weight="bold" textLength="46.8" lengthAdjust="spacing" xml:space="preserve">alice:</text>
<text x="90" y="497" textLength="834.6" lengthAdjust="spacing" xml:space="preserve"> whether she'll fix the two problems I flagged in #22, or wants the room to accept them as a plan revision.</text>
<text x="12" y="514" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">  - </text>
<text x="43.2" y="514" font-weight="bold" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">bob:</text>
<text x="74.4" y="514" textLength="421.2" lengthAdjust="spacing" xml:space="preserve"> confirmation that he's taking the verification tests.</text>
<text x="12" y="548" fill="#949494" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✻</text>
<text x="27.6" y="548" fill="#949494" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">Waiting for </text>
