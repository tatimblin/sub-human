<text x="12" y="72" textLength="538.2" lengthAdjust="spacing" xml:space="preserve">  I added both to the draft plan and summed them up in the room (#7).</text>
<text x="12" y="106" textLength="491.4" lengthAdjust="spacing" xml:space="preserve">  Still waiting on bob's answer to #6: the default and maximum </text>
<text x="503.4" y="106" fill="#b1b9f9" textLength="39" lengthAdjust="spacing" xml:space="preserve">limit</text>
<text x="542.4" y="106" textLength="1021.8" lengthAdjust="spacing" xml:space="preserve">, and whether a too-large limit is reduced to the maximum or rejected with a 400. Once he answers, I'll finish the plan and send it</text>
<text x="12" y="123" textLength="234" lengthAdjust="spacing" xml:space="preserve">  to alice and bob to approve.</text>
<text x="12" y="157" fill="#999999" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✻</text>
<text x="27.6" y="157" fill="#999999" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">Waiting for </text>
<text x="121.2" y="157" fill="#999999" font-weight="bold" xml:space="preserve">2</text>
<text x="129" y="157" fill="#999999" textLength="218.4" lengthAdjust="spacing" xml:space="preserve"> background agents to finish</text>
<text x="12" y="191" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="191" textLength="312" lengthAdjust="spacing" xml:space="preserve"> Monitor event: &quot;sub-human room notices&quot;</text>
<text x="12" y="225" fill="#4eba65" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
