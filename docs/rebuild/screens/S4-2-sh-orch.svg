<text x="19.8" y="157" textLength="920.4" lengthAdjust="spacing" xml:space="preserve"> Bob has joined room bison-3139, and his row is now in the agent panel next to Alice's. I didn't post anything to him,</text>
<text x="12" y="174" textLength="865.8" lengthAdjust="spacing" xml:space="preserve">  since there's no plan to point him to yet. My question to Alice (#2) about what the room should plan is still</text>
<text x="12" y="191" textLength="101.4" lengthAdjust="spacing" xml:space="preserve">  unanswered.</text>
<text x="12" y="225" fill="#949494" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✻</text>
<text x="27.6" y="225" fill="#949494" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">Waiting for </text>
