<text x="12" y="429" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="429" textLength="1201.2" lengthAdjust="spacing" xml:space="preserve"> bob asked me to propose the paging plan to him and alice (#9), so I did (#11). Each of them has an approval card to answer, and neither has answered yet.</text>
<text x="12" y="463" textLength="335.4" lengthAdjust="spacing" xml:space="preserve">  The plan uses the details they each gave:</text>
<text x="12" y="480" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">  - </text>
<text x="43.2" y="480" font-weight="bold" textLength="46.8" lengthAdjust="spacing" xml:space="preserve">Order:</text>
<text x="90" y="480" textLength="140.4" lengthAdjust="spacing" xml:space="preserve"> newest first, by </text>
<text x="230.4" y="480" fill="#b1b9f9" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">createdAt</text>
<text x="300.6" y="480" textLength="46.8" lengthAdjust="spacing" xml:space="preserve"> then </text>
<text x="347.4" y="480" fill="#b1b9f9" textLength="15.6" lengthAdjust="spacing" xml:space="preserve">id</text>
<text x="363" y="480" textLength="304.2" lengthAdjust="spacing" xml:space="preserve">, because some tasks share a timestamp.</text>
<text x="12" y="497" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">  - </text>
<text x="43.2" y="497" font-weight="bold" textLength="46.8" lengthAdjust="spacing" xml:space="preserve">Limit:</text>
<text x="90" y="497" textLength="249.6" lengthAdjust="spacing" xml:space="preserve"> default 20, max 50 (alice, #8).</text>
<text x="12" y="514" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">  - </text>
<text x="43.2" y="514" font-weight="bold" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">Response:</text>
<text x="121.2" y="514" fill="#b1b9f9" textLength="148.2" lengthAdjust="spacing" xml:space="preserve">{items, nextCursor}</text>
<text x="269.4" y="514" textLength="62.4" lengthAdjust="spacing" xml:space="preserve">, where </text>
<text x="331.8" y="514" fill="#b1b9f9" textLength="78" lengthAdjust="spacing" xml:space="preserve">nextCursor</text>
<text x="409.8" y="514" textLength="390" lengthAdjust="spacing" xml:space="preserve"> is null when there are no more pages (alice, #8).</text>
<text x="12" y="531" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">  - </text>
<text x="43.2" y="531" font-weight="bold" textLength="156" lengthAdjust="spacing" xml:space="preserve">Cursor past the end:</text>
<text x="199.2" y="531" textLength="273" lengthAdjust="spacing" xml:space="preserve"> returns an empty page (alice, #8).</text>
<text x="12" y="548" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">  - </text>
<text x="43.2" y="548" font-weight="bold" textLength="132.6" lengthAdjust="spacing" xml:space="preserve">Malformed cursor:</text>
<text x="175.8" y="548" textLength="195" lengthAdjust="spacing" xml:space="preserve"> returns a 400 (bob, #9).</text>
<text x="12" y="582" textLength="405.6" lengthAdjust="spacing" xml:space="preserve">  One question is still open in the plan: whether a </text>
<text x="417.6" y="582" fill="#b1b9f9" textLength="39" lengthAdjust="spacing" xml:space="preserve">limit</text>
<text x="456.6" y="582" textLength="1068.6" lengthAdjust="spacing" xml:space="preserve"> above 50 (or not a positive number) gets cut down to 50 or rejected with a 400. Neither of them has said, so I didn't pick one. They can</text>
<text x="12" y="599" textLength="374.4" lengthAdjust="spacing" xml:space="preserve">  settle it in the room or in their card's note.</text>
<text x="12" y="633" textLength="1248" lengthAdjust="spacing" xml:space="preserve">  The plan is decided only once the room records both card answers. Then I can help split the work: bob has offered to write the tests (#4), and the handler in </text>
<text x="1260" y="633" fill="#b1b9f9" textLength="101.4" lengthAdjust="spacing" xml:space="preserve">src/server.js</text>
<text x="1361.4" y="633" textLength="140.4" lengthAdjust="spacing" xml:space="preserve"> has no owner yet.</text>
<text x="12" y="667" fill="#999999" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✻</text>
