<text x="27.6" y="72" fill="#999999" textLength="226.2" lengthAdjust="spacing" xml:space="preserve">Called plugin:sub-human:room </text>
<text x="12" y="106" fill="#ffffff" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺</text>
<text x="19.8" y="106" textLength="1544.4" lengthAdjust="spacing" xml:space="preserve"> I revised the paging plan for bob's objection and sent it to bob and alice as a new proposal. That replaces the old one, so alice's earlier agreement no longer counts, and neither has answered yet.</text>
<text x="12" y="140" textLength="405.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  bob asked for &quot;a test for a cursor past the end — </text>
<text x="417.6" y="140" fill="#b1b9f9" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">after=zzz</text>
<text x="487.8" y="140" textLength="358.8" lengthAdjust="spacing" xml:space="preserve"> must 400, not 500&quot;. The plan now covers that:</text>
<text x="12" y="157" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">  - </text>
<text x="43.2" y="157" font-weight="bold" textLength="85.8" lengthAdjust="spacing" xml:space="preserve">Bad cursor:</text>
<text x="129" y="157" textLength="468" lengthAdjust="spacing" xml:space="preserve"> anything that fails to decode or has the wrong shape, like </text>
<text x="597" y="157" fill="#b1b9f9" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">after=zzz</text>
<text x="667.2" y="157" textLength="335.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">, gets a 400 &quot;invalid cursor&quot;, never a 500.</text>
<text x="12" y="174" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">  - </text>
<text x="43.2" y="174" font-weight="bold" textLength="202.8" lengthAdjust="spacing" xml:space="preserve">Cursor past the last task:</text>
<text x="246" y="174" textLength="616.2" lengthAdjust="spacing" xml:space="preserve"> a valid cursor with nothing after it returns an empty page and no next cursor.</text>
<text x="12" y="208" fill="#999999" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✻</text>
