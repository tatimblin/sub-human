<text x="82.2" y="718" fill="#e5c07b" textLength="140.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⚠ reviewing 6a33e8</text>
<text x="222.6" y="718" fill="#949494" textLength="23.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> · </text>
<text x="246" y="718" fill="#e5c07b" textLength="54.6" lengthAdjust="spacing" xml:space="preserve">working</text>
