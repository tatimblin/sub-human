<text x="19.8" y="276" textLength="1302.6" lengthAdjust="spacing" xml:space="preserve"> bob and alice both agreed to the revised paging plan, so it's decided. I added task 2, &quot;cursor paging handler&quot;, as alice asked; it's owned by alice and still pending.</text>
