<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 734" width="960" height="734" role="img" aria-label="orch · S8" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13">
<rect x="0.5" y="0.5" width="959" height="733" rx="9" fill="#16181d" stroke="#3a3e48"/>
<path d="M0.5 30V9.5a9 9 0 0 1 9-9h941a9 9 0 0 1 9 9V30z" fill="#22252c"/>
<line x1="0.5" y1="30" x2="959.5" y2="30" stroke="#3a3e48"/>
<circle cx="16" cy="15" r="5.5" fill="#ff5f57"/>
<circle cx="34" cy="15" r="5.5" fill="#febc2e"/>
<circle cx="52" cy="15" r="5.5" fill="#28c840"/>
<text x="480" y="19" text-anchor="middle" fill="#9aa1ad" font-size="12" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">orch · S8</text>
<g fill="#d6dbe5">
<text x="12" y="55" textLength="54.6" lengthAdjust="spacing" xml:space="preserve">     - </text>
<text x="66.6" y="55" font-weight="bold" textLength="78" lengthAdjust="spacing" xml:space="preserve">Next page:</text>
<text x="144.6" y="55" textLength="366.6" lengthAdjust="spacing" xml:space="preserve"> when more results exist, the response carries </text>
<text x="511.2" y="55" fill="#afd7ff" textLength="366.6" lengthAdjust="spacing" xml:space="preserve">Link: &lt;/tasks?limit=N&amp;after=CURSOR&gt;; rel=&quot;next&quot;</text>
<text x="877.8" y="55" textLength="70.2" lengthAdjust="spacing" xml:space="preserve"> (#8). On</text>
<text x="12" y="72" textLength="257.4" lengthAdjust="spacing" xml:space="preserve">       the last page there is no </text>
<text x="269.4" y="72" fill="#afd7ff" textLength="62.4" lengthAdjust="spacing" xml:space="preserve">rel=next</text>
<text x="331.8" y="72" textLength="46.8" lengthAdjust="spacing" xml:space="preserve"> link.</text>
<text x="12" y="89" textLength="561.6" lengthAdjust="spacing" xml:space="preserve">     - Sort order must be stable so cursors stay valid between requests.</text>
<text x="51" y="123" font-weight="bold" textLength="405.6" lengthAdjust="spacing" xml:space="preserve">Open questions (to close before or during the build)</text>
<text x="12" y="157" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">     - What </text>
<text x="105.6" y="157" fill="#afd7ff" textLength="39" lengthAdjust="spacing" xml:space="preserve">limit</text>
<text x="144.6" y="157" textLength="249.6" lengthAdjust="spacing" xml:space="preserve"> defaults to when it is omitted.</text>
<text x="12" y="174" textLength="195" lengthAdjust="spacing" xml:space="preserve">     - What happens when </text>
<text x="207" y="174" fill="#afd7ff" textLength="39" lengthAdjust="spacing" xml:space="preserve">after</text>
<text x="246" y="174" textLength="288.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> is malformed or stale (suggest 400).</text>
<text x="51" y="208" font-weight="bold" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">Set aside</text>
<text x="12" y="242" textLength="538.2" lengthAdjust="spacing" xml:space="preserve">     - Page-number or offset paging: bob wants an opaque cursor (#6).</text>
<text x="12" y="259" textLength="195" lengthAdjust="spacing" xml:space="preserve">     - An envelope body (</text>
<text x="207" y="259" fill="#afd7ff" textLength="101.4" lengthAdjust="spacing" xml:space="preserve">{items, next}</text>
<text x="308.4" y="259" textLength="288.6" lengthAdjust="spacing" xml:space="preserve">): alice wants a bare array (#4, #8).</text>
<text x="51" y="293" font-weight="bold" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">Approvers</text>
<text x="12" y="327" textLength="54.6" lengthAdjust="spacing" xml:space="preserve">     - </text>
<text x="66.6" y="327" font-weight="bold" textLength="39" lengthAdjust="spacing" xml:space="preserve">alice</text>
<text x="105.6" y="327" textLength="514.8" lengthAdjust="spacing" xml:space="preserve">: proposed the design (#4) and settled where the cursor goes (#8).</text>
<text x="12" y="344" textLength="54.6" lengthAdjust="spacing" xml:space="preserve">     - </text>
<text x="66.6" y="344" font-weight="bold" textLength="23.4" lengthAdjust="spacing" xml:space="preserve">bob</text>
<text x="90" y="344" textLength="600.6" lengthAdjust="spacing" xml:space="preserve">: asked to approve, set the opaque-cursor rule (#6) and the clamp rule (#11).</text>
<text x="51" y="378" font-weight="bold" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">Verification</text>
<text x="12" y="412" textLength="202.8" lengthAdjust="spacing" xml:space="preserve">     - First page with no </text>
<text x="214.8" y="412" fill="#afd7ff" textLength="39" lengthAdjust="spacing" xml:space="preserve">after</text>
<text x="253.8" y="412" textLength="132.6" lengthAdjust="spacing" xml:space="preserve"> returns at most </text>
<text x="386.4" y="412" fill="#afd7ff" textLength="39" lengthAdjust="spacing" xml:space="preserve">limit</text>
<text x="425.4" y="412" textLength="265.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> items (never more than 50) and a </text>
<text x="690.6" y="412" fill="#afd7ff" textLength="62.4" lengthAdjust="spacing" xml:space="preserve">rel=next</text>
<text x="753" y="412" textLength="171.6" lengthAdjust="spacing" xml:space="preserve"> Link header when more</text>
<text x="12" y="429" textLength="156" lengthAdjust="spacing" xml:space="preserve">       items remain.</text>
<text x="12" y="446" textLength="132.6" lengthAdjust="spacing" xml:space="preserve">     - Following </text>
<text x="144.6" y="446" fill="#afd7ff" textLength="62.4" lengthAdjust="spacing" xml:space="preserve">rel=next</text>
<text x="207" y="446" textLength="507" lengthAdjust="spacing" xml:space="preserve"> links walks every task exactly once, with no duplicates or gaps.</text>
<text x="12" y="463" textLength="218.4" lengthAdjust="spacing" xml:space="preserve">     - The last page has no </text>
<text x="230.4" y="463" fill="#afd7ff" textLength="62.4" lengthAdjust="spacing" xml:space="preserve">rel=next</text>
<text x="292.8" y="463" textLength="46.8" lengthAdjust="spacing" xml:space="preserve"> link.</text>
<text x="12" y="480" textLength="54.6" lengthAdjust="spacing" xml:space="preserve">     - </text>
<text x="66.6" y="480" fill="#afd7ff" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">limit=500</text>
<text x="136.8" y="480" textLength="358.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> returns 200 with at most 50 items, not a 400.</text>
<text x="12" y="497" textLength="343.2" lengthAdjust="spacing" xml:space="preserve">     - The body is always a bare JSON array.</text>
<text x="12" y="531" fill="#d78787" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✽</text>
<text x="27.6" y="531" fill="#d78787" textLength="78" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Infusing… </text>
<text x="105.6" y="531" fill="#949494" textLength="54.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">(3s · ↓</text>
<text x="168" y="531" fill="#949494" textLength="93.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">31 tokens · </text>
<text x="261.6" y="531" fill="#9e9e9e" textLength="62.4" lengthAdjust="spacing" xml:space="preserve">thinking</text>
<text x="324" y="531" fill="#949494" xml:space="preserve">)</text>
<text x="12" y="548" fill="#949494" textLength="561.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ⎿  Tip: You have 4 plugins you haven't used lately. Disable them with </text>
<text x="573.6" y="548" fill="#afd7ff" textLength="54.6" lengthAdjust="spacing" xml:space="preserve">/plugin</text>
<text x="628.2" y="548" fill="#949494" textLength="319.8" lengthAdjust="spacing" xml:space="preserve"> to free up context and speed up startup.</text>
<text x="511.2" y="565" fill="#ffd700" textLength="179.4" lengthAdjust="spacing" xml:space="preserve">Update available! Run: </text>
<text x="690.6" y="565" fill="#ffd700" font-weight="bold" textLength="241.8" lengthAdjust="spacing" xml:space="preserve">brew upgrade claude-code@latest</text>
<text x="12" y="582" fill="#808080" textLength="936" lengthAdjust="spacingAndGlyphs" xml:space="preserve">─────────────────────────────────────────────────────────────────────────────────────────────────── ⬡ vole-8126 · orch ─</text>
<text x="12" y="599" fill="#949494" textLength="15.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">❯ </text>
<text x="12" y="616" fill="#808080" textLength="936" lengthAdjust="spacingAndGlyphs" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text>
<text x="27.6" y="633" fill="#949494" textLength="288.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⬡ vole-8126 · orch · plan eaae7e 2/2 </text>
<text x="316.2" y="633" fill="#98c379" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✔</text>
<text x="27.6" y="650" fill="#949494" textLength="148.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏸ manual mode on · </text>
<text x="175.8" y="650" fill="#00d7d7" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">1 monitor</text>
<text x="246" y="650" fill="#949494" textLength="93.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> · ← 1 agent</text>
<text x="12" y="684" font-weight="bold" textLength="62.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ⏺ main</text>
<text x="12" y="701" fill="#949494" textLength="85.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ◯ alice  </text>
<text x="97.8" y="701" fill="#98c379" textLength="124.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✔ decided eaae7e</text>
<text x="222.6" y="701" fill="#949494" textLength="23.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> · </text>
<text x="246" y="701" fill="#e5c07b" textLength="54.6" lengthAdjust="spacing" xml:space="preserve">working</text>
<text x="12" y="718" fill="#949494" textLength="70.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ◯ bob  </text>
<text x="82.2" y="718" fill="#98c379" textLength="124.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✔ decided eaae7e</text>
<text x="207" y="718" fill="#949494" textLength="23.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> · </text>
<text x="230.4" y="718" fill="#e5c07b" textLength="54.6" lengthAdjust="spacing" xml:space="preserve">working</text>
</g></svg>
