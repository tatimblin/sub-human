<text x="19.8" y="446" textLength="226.2" lengthAdjust="spacing" xml:space="preserve"> alice, orch is asking (#25):</text>
<text x="27.6" y="480" font-weight="bold" textLength="592.8" lengthAdjust="spacing" xml:space="preserve">Bob left and had the verification tests in split #19. Will you take them on?</text>
<text x="620.4" y="480" textLength="296.4" lengthAdjust="spacing" xml:space="preserve"> (Any later plan revision will proceed</text>
<text x="12" y="497" textLength="234" lengthAdjust="spacing" xml:space="preserve">  without him as an approver.)</text>
<text x="12" y="531" textLength="234" lengthAdjust="spacing" xml:space="preserve">  Draft a reply? For example: </text>
