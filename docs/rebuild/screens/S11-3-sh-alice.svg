<text x="27.6" y="72" font-weight="bold" textLength="444.6" lengthAdjust="spacing" xml:space="preserve">orch found two drifts in your build against decision #18.</text>
<text x="472.2" y="72" textLength="171.6" lengthAdjust="spacing" xml:space="preserve"> A malformed or stale </text>
